name: Release v0.1.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.1.3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --all-targets

      - name: Build release executable
        run: cargo build --release

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          Corrige o flash de janela do Prompt de Comando durante as atualizações periódicas.

          - subprocessos do Codex passam a usar CREATE_NO_WINDOW no Windows
          - vale tanto para codex.exe quanto para shims codex.cmd/.bat
          - mantém a descoberta automática do Codex adicionada na v0.1.2
          "@ | Set-Content -Encoding UTF8 release-notes.md

          gh release create v0.1.3 `
            "target/release/codex-usage-tray.exe#codex-usage-tray.exe" `
            --target $env:GITHUB_SHA `
            --title "v0.1.3" `
            --notes-file release-notes.md
